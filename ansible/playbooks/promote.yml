- name: Publish and promote a content view session
  hosts: localhost
  gather_facts: false
  vars:
    ansible_become: false
    content_view: RHEL9-Base
  module_defaults:
    group/theforeman.foreman.foreman:
      server_url: "https://katello.lab.internal"
      username: admin
      password: "{{ katello_admin_password }}"
      ca_path: "{{ katello_ca_path }}"
  pre_tasks:
    - name: Fetch Katello CA certificate over SSH (trusted channel)
      ansible.builtin.fetch:
        src: /var/www/html/pub/katello-server-ca.crt
        dest: "{{ katello_ca_path }}"
        flat: true
      delegate_to: katello
      vars:
       ansible_become: true
  tasks:
    - name: Require a version and target environments
      ansible.builtin.assert:
        that:
          - cv_version is defined
          - cv_envs is defined
          - cv_envs | length > 0
        fail_msg: "Usage -e cv_version=2.0 -e '{\"cv_envs\": [\"Library\",\"Dev\"]}'"

    - name: "Promote {{ content_view }} {{ cv_version }} to {{ cv_envs | join(', ') }}"
      theforeman.foreman.content_view_version:
        organization: "{{ katello_org }}"
        content_view: "{{ content_view }}"
        version: "{{ cv_version }}"
        lifecycle_environments: "{{ cv_envs }}"
