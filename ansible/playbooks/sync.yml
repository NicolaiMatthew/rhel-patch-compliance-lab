- name: Sync Red Hat content from the CDN
  hosts: localhost
  gather_facts: false
  vars:
    ansible_become: false
  vars_files:
    - ../roles/katello_content/defaults/main.yml
  module_defaults:
    group/theforeman.foreman.foreman:
      server_url: "https://katello.lab.internal"
      username: admin
      password: "{{ katello_admin_password }}"
      ca_path: "{{ katello_ca_path }}"
  pre_tasks:
    - name: Fetch Katello CA certificate over SSH (trusted channel)
      ansible.builtin.fetch:
        src: /var/www/html/pub/katello-server-ca.crt
        dest: "{{ katello_ca_path }}"
        flat: true
      delegate_to: katello
      vars:
        ansible_become: true
  tasks:
    - name: Sync RHEL 9 repositories (metadata only, on-demand)
      theforeman.foreman.repository_sync:
        organization: "{{ katello_org }}"
        product: "{{ rhel_product }}"
        repository: "{{ item.repo }}"
      loop: "{{ rhel_repo_sets }}"
