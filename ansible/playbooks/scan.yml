- name: OpenSCAP compliance scan (CIS RHEL 9 Level 1 Server)
  hosts: rhel_clients
  vars:
    scan_phase: baseline   # "baseline" now; Phase 6 reruns this with -e scan_phase=remediated
    scap_profile: xccdf_org.ssgproject.content_profile_cis_server_l1
    scap_content: /usr/share/xml/scap/ssg/content/ssg-rhel9-ds.xml
    remote_dir: /var/tmp/oscap
    local_dir: "{{ playbook_dir }}/../../reports/{{ scan_phase }}"

  tasks:
    # Scanner + rule content, served by Katello from AppStream
    - name: Install OpenSCAP scanner and SCAP Security Guide content
      ansible.builtin.dnf:
        name: [openscap-scanner, scap-security-guide]
        state: present

    - name: Create scan output directory
      ansible.builtin.file:
        path: "{{ remote_dir }}"
        state: directory
        mode: "0700"

    # oscap exit codes: 0 = all rules pass, 2 = some rules fail (expected), 1 = scanner error
    - name: Run CIS Level 1 Server scan
      ansible.builtin.command: >
        oscap xccdf eval
        --profile {{ scap_profile }}
        --results-arf {{ remote_dir }}/{{ inventory_hostname }}-{{ scan_phase }}-arf.xml
        --report {{ remote_dir }}/{{ inventory_hostname }}-{{ scan_phase }}.html
        {{ scap_content }}
      register: scan
      failed_when: scan.rc not in [0, 2]
      changed_when: false

    # The percentage score is inside the ARF results file
    - name: Extract compliance score
      ansible.builtin.shell: >
        grep -oP 'urn:xccdf:scoring:default[^>]*>\K[0-9.]+' {{ remote_dir }}/{{ inventory_hostname }}-{{ scan_phase }}-arf.xml | head -1
      register: score
      changed_when: false

    # Count pass/fail lines from oscap's terminal output
    - name: Count passed and failed rules
      ansible.builtin.set_fact:
        scan_pass: "{{ scan.stdout | regex_findall('Result\\s+pass') | length }}"
        scan_fail: "{{ scan.stdout | regex_findall('Result\\s+fail') | length }}"

    # Copy the reports from each host back to repo
    - name: Fetch HTML report
      ansible.builtin.fetch:
        src: "{{ remote_dir }}/{{ inventory_hostname }}-{{ scan_phase }}.html"
        dest: "{{ local_dir }}/"
        flat: true

    - name: Fetch ARF results (local only, for Phase 6 comparison)
      ansible.builtin.fetch:
        src: "{{ remote_dir }}/{{ inventory_hostname }}-{{ scan_phase }}-arf.xml"
        dest: "{{ local_dir }}/"
        flat: true

    # One-line score file per host, written on PC
    - name: Write score summary
      ansible.builtin.copy:
        content: "{{ inventory_hostname }} | {{ scan_phase }} | score {{ score.stdout }}% | pass {{ scan_pass }} | fail {{ scan_fail }}\n"
        dest: "{{ local_dir }}/{{ inventory_hostname }}-summary.txt"
        mode: "0644"
      delegate_to: localhost
      vars:
        ansible_become: false

    - name: Show score
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ score.stdout }}% ({{ scan_pass }} pass / {{ scan_fail }} fail)"
