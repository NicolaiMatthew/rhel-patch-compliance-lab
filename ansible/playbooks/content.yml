- name: Katello content pipeline
  hosts: localhost
  gather_facts: false
  vars:
    ansible_become: false
  module_defaults:
    group/theforeman.foreman.foreman:
      server_url: "https://katello.lab.internal"
      username: admin
      password: "{{ katello_admin_password }}"
      ca_path: "{{ katello_ca_path }}" # checking Katello's TLS cert against own CA
  pre_tasks:
    - name: Fetch Katello CA certificate over SSH (trusted channel)
      ansible.builtin.fetch:
        src: /var/www/html/pub/katello-server-ca.crt
        dest: "{{ katello_ca_path }}"
        flat: true
      delegate_to: katello
      vars:
        ansible_become: true
  roles:
    - katello_content
